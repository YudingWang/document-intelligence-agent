server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
